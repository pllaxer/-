<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Для тебя</title>
    <style>
        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: 'Georgia', serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .card {
            background: #1e1e1e;
            padding: 30px;
            border-radius: 12px;
            border: 1px solid #333;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            max-width: 500px;
            width: 100%;
            text-align: center;
            animation: fadeIn 2s ease-in-out;
        }
        h1 {
            color: #ffffff;
            font-size: 24px;
            margin-bottom: 20px;
            border-bottom: 1px solid #444;
            padding-bottom: 10px;
        }
        p {
            font-size: 16px;
            line-height: 1.8;
            color: #ccc;
            white-space: pre-line;
            text-align: left;
        }
        .heart {
            color: #888;
            font-size: 20px;
            margin-top: 20px;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Секретное послание</h1>
        <p>
Вот здесь напиши свой текст. 
Он откроется с красивой анимацией плавного появления на темном фоне.

Каждая новая строка будет выглядеть аккуратно и красиво.
        </p>
        <div class="heart">❖ ❖ ❖</div>
    </div>
</body>
</html>
